<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Deep navy background, signature Prime colour -->
  <rect width="48" height="48" rx="12" fill="#0F1111"/>
  <!-- Prime "P" wordmark shape -->
  <text x="10" y="33" font-family="'Amazon Ember','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-1">P</text>
  <!-- Prime blue underline swoosh -->
  <path d="M9.5 37 Q24 43 38.5 37" stroke="#00A8E1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- "prime" small text -->
  <text x="10" y="46" font-family="'Amazon Ember','Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="600" fill="#00A8E1" letter-spacing="0.5">prime</text>
</svg>
