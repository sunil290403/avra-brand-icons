<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Deep Quality Grocery Green Background -->
  <rect width="100" height="100" rx="22" fill="#0D3B2E"/>
  <!-- Grocery Shopping Bag / Fresh Leaf Motif -->
  <g transform="translate(50, 38)">
    <!-- Bag handles -->
    <path d="M-11 -8 C-11 -18 11 -18 11 -8" fill="none" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bag body -->
    <rect x="-19" y="-8" width="38" height="30" rx="6" fill="#115E46"/>
    <!-- Organic Sprout / Fresh Produce Leaf on bag -->
    <path d="M0 14 C0 2 -12 2 -12 -5 C-5 -5 0 2 0 14 Z" fill="#4ADE80"/>
    <path d="M0 14 C0 0 12 0 12 -7 C5 -7 0 2 0 14 Z" fill="#86EFAC"/>
  </g>
  <!-- FirstClub Clean White Typography -->
  <text x="50" y="82" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FirstClub</text>
</svg>